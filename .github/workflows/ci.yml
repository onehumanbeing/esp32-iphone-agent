name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12"]
        include:
          - os: windows-latest
            python: "3.13"  # before 3.13 time.time() ticks every ~16 ms on Windows, too coarse for the fake screens
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,mcp]"
      - run: ruff check .
      - run: pytest -q

  flash-scripts-windows:  # Git Bash: the scripts parse and the COM port lookup runs
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - run: |
          for f in hardware/*.sh; do bash -n "$f"; done
          source hardware/ports.sh
          windows
          out=$(serial_port 303A 2>&1); [[ -z $out ]] || { echo "$out"; exit 1; }

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Build
        working-directory: hardware
        run: |
          cp hid_bridge/secrets.example.h hid_bridge/secrets.h
          arduino-cli compile -b "esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc,FlashSize=8M" hid_bridge
